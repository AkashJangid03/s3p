<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        body {
            font-family: Arial;
            background-color: whitesmoke;
            text-align: center;
        }

        .container {
            width: 350px;
            margin: 80px auto;
            padding: 25px;
            border-color: white;
            border-radius: 10px;
            box-shadow: 0px 0px 20px gray;
        }

        h2 {
            color: #333;
        }

        p {
            text-align: left;
            padding: 10px;
            background-color: #eeeeee;
            border-radius: 5px;
        }

        b {
            color: #007bff;
        }

        hr {
            border-color: red;
        }

        span {
            color: black;
        }
    </style>
</head>
<body ng-app="myApp" ng-controller="myCtrl">
    <div class="container">
        <h2>Student Information</h2>
        <hr>
        <p><b>Student Name:</b> <span>{{name}}</span></p>
        <p><b>Roll Number:</b> <span>{{rollno}}</span></p>
        <p><b>Course:</b> <span>{{course}}</span></p>
        <p><b>College Name:</b> <span>{{college}}</span></p>
    </div>
    <script>
        var app = angular.module("myApp", []);
        app.controller("myCtrl", function($scope) {
            $scope.name = "Akash";
            $scope.rollno = 256303;
            $scope.course = "M.Sc Computer Application";
            $scope.college = "Fergusson College";
        });
    </script>
</body>
</html>
